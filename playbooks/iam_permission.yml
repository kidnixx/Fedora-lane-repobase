
---
- name: Check IAM write permissions
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Check IAM write permissions without making changes
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import boto3
            import json

            iam = boto3.client("iam")

            checks = {
                "create_role": {
                    "Action": "iam:CreateRole",
                    "Resource": "*"
                },
                "attach_role_policy": {
                    "Action": "iam:AttachRolePolicy",
                    "Resource": "*"
                },
                "create_instance_profile": {
                    "Action": "iam:CreateInstanceProfile",
                    "Resource": "*"
                },
                "add_role_to_instance_profile": {
                    "Action": "iam:AddRoleToInstanceProfile",
                    "Resource": "*"
                }
            }

            results = {}

            for name, permission in checks.items():
                try:
                    iam.simulate_principal_policy(
                        PolicySourceArn=boto3.client("sts").get_caller_identity()["Arn"],
                        ActionNames=[permission["Action"]],
                        ResourceArns=["*"]
                    )
                    results[name] = "Simulation completed"
                except Exception as e:
                    results[name] = str(e)

            print(json.dumps(results, indent=2))
      register: iam_write_checks
      changed_when: false

    - name: Display IAM write permission checks
      ansible.builtin.debug:
        var: iam_write_checks.stdout
