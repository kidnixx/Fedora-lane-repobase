
---
- name: Check IAM write permissions for Fedora Lane
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Evaluate IAM permissions without making changes
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import boto3
            import json

            iam = boto3.client("iam")
            sts = boto3.client("sts")

            identity = sts.get_caller_identity()
            caller_arn = identity["Arn"]

            if ":assumed-role/" in caller_arn:
                role_name = caller_arn.split(
                    ":assumed-role/"
                )[1].split("/")[0]

                policy_arn = (
                    f"arn:aws:iam::{identity['Account']}:role/{role_name}"
                )
            else:
                policy_arn = caller_arn

            actions = [
                "iam:CreateRole",
                "iam:AttachRolePolicy",
                "iam:CreateInstanceProfile",
                "iam:AddRoleToInstanceProfile"
            ]

            response = iam.simulate_principal_policy(
                PolicySourceArn=policy_arn,
                ActionNames=actions,
                ResourceArns=["*"]
            )

            results = {}

            for item in response["EvaluationResults"]:
                results[item["EvalActionName"]] = {
                    "decision": item["EvalDecision"],
                    "missing_context": item.get(
                        "MissingContextValues", []
                    )
                }

            print(json.dumps({
                "caller": caller_arn,
                "evaluated_policy": policy_arn,
                "permissions": results
            }, indent=2))

      register: iam_permission_result
      changed_when: false

    - name: Display IAM permission evaluation
      ansible.builtin.debug:
        var: iam_permission_result.stdout
