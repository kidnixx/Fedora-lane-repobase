
---
- name: Check Fedora Lane SSM registration
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Check SSM managed instance status
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import boto3, json

            ssm = boto3.client("ssm", region_name="us-east-2")
            result = ssm.describe_instance_information(
                Filters=[
                    {
                        "Key": "InstanceIds",
                        "Values": ["i-05bc97e40ed6b7e89"]
                    }
                ]
            )

            print(json.dumps([
                {
                    "instance_id": item["InstanceId"],
                    "ping_status": item["PingStatus"],
                    "agent_version": item.get("AgentVersion"),
                    "last_ping": str(item.get("LastPingDateTime"))
                }
                for item in result["InstanceInformationList"]
            ], indent=2))
      register: ssm_status
      changed_when: false

    - name: Display SSM status
      ansible.builtin.debug:
        var: ssm_status.stdout
