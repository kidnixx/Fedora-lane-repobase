
---
- name: Check Fedora Lane instance SSM registration
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Retrieve SSM managed instance information
      amazon.aws.ssm_instance_info:
        region: us-east-2
      register: ssm_instances

    - name: Display registration status
      ansible.builtin.debug:
        msg: >-
          {{ ssm_instances }}
