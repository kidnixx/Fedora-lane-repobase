
---
- name: Check Fedora Lane SSM registration
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Query AWS Systems Manager
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import boto3
            import json

            client = boto3.client("ssm", region_name="us-east-2")
            response = client.describe_instance_information(
                Filters=[
                    {
                        "Key": "InstanceIds",
                        "Values": ["i-0bc378a668bdc9ca5"]
                    }
                ]
            )

            print(json.dumps(
                response.get("InstanceInformationList", []),
                default=str,
                indent=2
            ))
      register: ssm_result
      changed_when: false

    - name: Display SSM registration result
      ansible.builtin.debug:
        var: ssm_result.stdout
