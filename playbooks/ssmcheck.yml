
---
- name: Inspect Fedora Lane outbound network access
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Inspect security groups, network ACL and VPC DNS
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import boto3
            import json

            ec2 = boto3.client("ec2", region_name="us-east-2")
            instance_id = "i-0bc378a668bdc9ca5"

            instance = ec2.describe_instances(
                InstanceIds=[instance_id]
            )["Reservations"][0]["Instances"][0]

            sg_ids = [
                sg["GroupId"]
                for sg in instance["SecurityGroups"]
            ]

            groups = ec2.describe_security_groups(
                GroupIds=sg_ids
            )["SecurityGroups"]

            nacls = ec2.describe_network_acls(
                Filters=[
                    {
                        "Name": "association.subnet-id",
                        "Values": [instance["SubnetId"]]
                    }
                ]
            )["NetworkAcls"]

            dns = ec2.describe_vpc_attribute(
                VpcId=instance["VpcId"],
                Attribute="enableDnsSupport"
            )

            hostnames = ec2.describe_vpc_attribute(
                VpcId=instance["VpcId"],
                Attribute="enableDnsHostnames"
            )

            result = {
                "security_groups": [
                    {
                        "id": sg["GroupId"],
                        "name": sg["GroupName"],
                        "egress": sg["IpPermissionsEgress"]
                    }
                    for sg in groups
                ],
                "network_acls": [
                    {
                        "id": acl["NetworkAclId"],
                        "entries": acl["Entries"]
                    }
                    for acl in nacls
                ],
                "vpc_dns_support": dns["EnableDnsSupport"]["Value"],
                "vpc_dns_hostnames": hostnames["EnableDnsHostnames"]["Value"]
            }

            print(json.dumps(result, indent=2, default=str))
      register: network_detail
      changed_when: false

    - name: Display outbound network details
      ansible.builtin.debug:
        var: network_detail.stdout
