
---
- name: Fedora Lane event demonstration
  hosts: all

  sources:
    - name: staging_health_event
      eda.builtin.generic:
        payload:
          - alert: staging_health_check
            environment: staging
            severity: warning
        event_delay: 5

  rules:
    - name: Respond to staging health alert
      condition: event.alert == "staging_health_check"
      action:
        print_event:
          pretty: true
