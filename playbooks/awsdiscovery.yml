
---
- name: Discover AWS resources for Fedora Lane demo
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    aws_region: us-east-2

  tasks:
    - name: Get available VPCs
      amazon.aws.ec2_vpc_net_info:
        region: "{{ aws_region }}"
      register: vpcs

    - name: Get available subnets
      amazon.aws.ec2_vpc_subnet_info:
        region: "{{ aws_region }}"
      register: subnets

    - name: Get security groups
      amazon.aws.ec2_security_group_info:
        region: "{{ aws_region }}"
      register: security_groups

    - name: Get available RHEL 9 images
      amazon.aws.ec2_ami_info:
        region: "{{ aws_region }}"
        owners:
          - "309956199498"
        filters:
          architecture: x86_64
          state: available
          name: "*RHEL-9*"
      register: rhel_images

    - name: Show VPC summary
      ansible.builtin.debug:
        msg:
          - "VPC: {{ item.vpc_id }}"
          - "CIDR: {{ item.cidr_block }}"
          - "State: {{ item.state }}"
      loop: "{{ vpcs.vpcs }}"

    - name: Show subnet summary
      ansible.builtin.debug:
        msg:
          - "Subnet: {{ item.subnet_id }}"
          - "VPC: {{ item.vpc_id }}"
          - "AZ: {{ item.availability_zone }}"
          - "CIDR: {{ item.cidr_block }}"
      loop: "{{ subnets.subnets }}"

    - name: Show security group summary
      ansible.builtin.debug:
        msg:
          - "Group ID: {{ item.group_id }}"
          - "Name: {{ item.group_name }}"
          - "VPC: {{ item.vpc_id }}"
      loop: "{{ security_groups.security_groups }}"

    - name: Show RHEL AMI summary
      ansible.builtin.debug:
        msg:
          - "AMI: {{ item.image_id }}"
          - "Name: {{ item.name | default('Not provided') }}"
          - "Created: {{ item.creation_date }}"
          - "State: {{ item.state }}"
          - "Owner: {{ item.owner_id }}"
      loop: "{{ rhel_images.images | sort(attribute='creation_date', reverse=true) }}"

      
    - name: Inspect Linux candidate security group rules
      ansible.builtin.debug:
        msg:
          group: "{{ item.group_name }}"
          id: "{{ item.group_id }}"
          inbound_rules: "{{ item.ip_permissions }}"
      loop: >-
        {{
          security_groups.security_groups
          | selectattr('group_id', 'equalto', 'sg-0f03d6a71ead5d941')
          | list
        }}

    - name: Display inbound rules for aws-test-sg
      ansible.builtin.debug:
        msg:
          protocol: "{{ item.ip_protocol }}"
          from_port: "{{ item.from_port | default('all') }}"
          to_port: "{{ item.to_port | default('all') }}"
          allowed_cidrs: "{{ item.ip_ranges | default([]) | map(attribute='cidr_ip') | list }}"
          source_security_groups: "{{ item.user_id_group_pairs | default([]) | map(attribute='group_id') | list }}"
      loop: >-
        {{
          (
            security_groups.security_groups
            | selectattr('group_id', 'equalto', 'sg-0f03d6a71ead5d941')
            | first
          ).ip_permissions
        }}

