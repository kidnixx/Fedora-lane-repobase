
---
- name: Discover AWS resources for Fedora Lane demo
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    aws_region: us-east-2

  tasks:
    - name: Get available VPCs
      amazon.aws.ec2_vpc_net_info:
        region: "{{ aws_region }}"
      register: vpcs

    - name: Get available subnets
      amazon.aws.ec2_vpc_subnet_info:
        region: "{{ aws_region }}"
      register: subnets

    - name: Get security groups
      amazon.aws.ec2_security_group_info:
        region: "{{ aws_region }}"
      register: security_groups

    - name: Get available RHEL 9 images
      amazon.aws.ec2_ami_info:
        region: "{{ aws_region }}"
        owners:
          - "309956199498"
        filters:
          architecture: x86_64
          state: available
          name: "*RHEL-9*"
      register: rhel_images
      
    - name: Display VPC details
      ansible.builtin.debug:
        var: vpcs.vpcs

    - name: Display subnet details
      ansible.builtin.debug:
        var: subnets.subnets

    - name: Display security group details
      ansible.builtin.debug:
        var: security_groups.security_groups

    - name: Display RHEL AMI details
      ansible.builtin.debug:
        var: rhel_images.images
