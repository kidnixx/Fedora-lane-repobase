
---
- name: Final AWS discovery for Fedora Lane demo
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    aws_region: us-east-2
    rhel9_instance_id: i-0d41864064f90a240
    rhel9_ami_id: ami-08e728aab89b9de96
    demo_security_group_id: sg-0f03d6a71ead5d941

  tasks:
    - name: Inspect existing RHEL 9 instance
      amazon.aws.ec2_instance_info:
        region: "{{ aws_region }}"
        instance_ids:
          - "{{ rhel9_instance_id }}"
      register: rhel9_instance

    - name: Inspect existing RHEL 9 AMI
      amazon.aws.ec2_ami_info:
        region: "{{ aws_region }}"
        image_ids:
          - "{{ rhel9_ami_id }}"
      register: rhel9_ami

    - name: Inspect existing demo security group
      amazon.aws.ec2_security_group_info:
        region: "{{ aws_region }}"
        filters:
          group-id: "{{ demo_security_group_id }}"
      register: demo_sg

    - name: Display instance configuration
      ansible.builtin.debug:
        msg:
          instance_id: "{{ item.instance_id }}"
          name: "{{ item.tags.Name | default('Unnamed') }}"
          state: "{{ item.state.name }}"
          instance_type: "{{ item.instance_type }}"
          ami: "{{ item.image_id }}"
          key_pair: "{{ item.key_name | default('None') }}"
          subnet: "{{ item.subnet_id }}"
          vpc: "{{ item.vpc_id }}"
          private_ip: "{{ item.private_ip_address | default('N/A') }}"
          public_ip: "{{ item.public_ip_address | default('N/A') }}"
          security_groups: "{{ item.security_groups | map(attribute='group_id') | list }}"
          iam_instance_profile: "{{ item.iam_instance_profile | default({}) }}"
      loop: "{{ rhel9_instance.instances }}"

    - name: Display AMI configuration
      ansible.builtin.debug:
        msg:
          image_id: "{{ item.image_id }}"
          name: "{{ item.name }}"
          owner: "{{ item.owner_id }}"
          state: "{{ item.state }}"
          architecture: "{{ item.architecture }}"
          root_device: "{{ item.root_device_name }}"
          block_devices: "{{ item.block_device_mappings }}"
      loop: "{{ rhel9_ami.images }}"

    - name: Display security group inbound rules
      ansible.builtin.debug:
        msg:
          protocol: "{{ item.ip_protocol }}"
          from_port: "{{ item.from_port | default('all') }}"
          to_port: "{{ item.to_port | default('all') }}"
          allowed_cidrs: "{{ item.ip_ranges | default([]) | map(attribute='cidr_ip') | list }}"
          source_security_groups: "{{ item.user_id_group_pairs | default([]) | map(attribute='group_id') | list }}"
      loop: "{{ demo_sg.security_groups[0].ip_permissions }}"
